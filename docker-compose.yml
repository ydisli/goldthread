# Example: Goldthread behind Caddy with automatic HTTPS. Untested here (no Docker on the
# build machine). Replace the domain, then: docker compose up -d
services:
  goldthread:
    build: .
    restart: unless-stopped
    environment:
      GT_PUBLIC_URL: https://goldthread.example.com
      GT_SIGNUP: invite-only
      # Optional: email, single sign-on, AI. See docs/SELF_HOSTING.md.
      # GT_SMTP_URL: smtp://user:password@smtp.example.com:587
      # GT_MAIL_FROM: Goldthread <goldthread@example.com>
      # GT_OIDC_ISSUER: https://login.microsoftonline.com/<tenant>/v2.0
      # GT_OIDC_CLIENT_ID: ...
      # GT_OIDC_CLIENT_SECRET: ...
      # GT_OIDC_NAME: Microsoft
    volumes:
      - goldthread-data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from goldthread.example.com --to goldthread:4300
    volumes:
      - caddy-data:/data
volumes:
  goldthread-data:
  caddy-data:
